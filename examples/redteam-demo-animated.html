        <div class="code mono">${ok ? `result: ALLOWED  ·  ${esc(c.checkout.total)} at ${esc(c.checkout.merchant)}` : "reason code: " + esc(c.code)}</div>`);
      st(stamp, { display: "flex", opacity: String(1 - out) });
      st($("#stamp .bg"), { background: ok ? "#0d3b1a99" : "#3b0d0d99", opacity: String(k) });
      st($("#stamp .word"), { color: col, borderColor: col, opacity: String(k), transform: `rotate(${ok ? -4 : -8}deg) scale(${lerp(1.8, 1, eo(k))})` });
      const w = prog(lt, T.stamp + 250, T.stamp + 600);
      st($("#stamp .why"), { opacity: String(w), transform: `translateY(${(1 - eo(w)) * 14}px)` });
      st($("#stamp .code"), { opacity: String(prog(lt, T.stamp + 400, T.stamp + 750)) });
    } else stamp.style.display = "none";
    // audit rows: newest on top; each row pushes older rows down as it slides in
    const H = 47, SLIDE = 420;
    const live = rowEls.filter(r => t >= r.t).sort((a, b) => b.t - a.t || b.a.id - a.a.id);
    let offset = 0;
    rowEls.forEach(r => { if (t < r.t) r.el.style.opacity = "0"; });
    live.forEach(r => {
      const p = eo(prog(t, r.t, r.t + SLIDE));
      const y = 8 + offset;
      if (y + 44 > 552) { r.el.style.opacity = "0"; } else st(r.el, { opacity: String(p), transform: `translate(${(1 - p) * 60}px,${y}px)` });
      offset += H * p;
    });
  }

  /* -------------------------------- playback -------------------------------- */
  function fit() { const k = Math.min(innerWidth / 1280, innerHeight / 720); stage.style.transform = `scale(${k})`; }
  addEventListener("resize", fit); fit();
  window.__tpa = { duration: TOTAL, render, data: DATA };
  render(0);
  if (!/[?&]record\b/.test(location.search)) {
    let t0 = null;
    const loop = now => { if (t0 === null) t0 = now; render((now - t0) % (TOTAL + 1500)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body></html>
